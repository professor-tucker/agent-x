[package]
name = "ph-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = { version = "0.29", features = ["serde"] }
env_logger = "0.10"
log = "0.4"
reqwest = { version = "0.11", features = ["json","rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
