name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
      - name: Build Rust agent
        working-directory: ./agent
        run: cargo build --release
      - name: Run Rust tests
        working-directory: ./agent
        run: cargo test --workspace --quiet

  test-python-controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install requirements
        working-directory: ./controller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run a simple lint
        run: python -m pyflakes controller || true
      - name: Run Python tests
        working-directory: ./controller
        run: |
          pytest -q

  build-iso:
    runs-on: ubuntu-latest
    needs: [build-rust]
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages for image build
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin \
            syslinux-utils mtools dosfstools
      - name: Build Rust agent (release)
        working-directory: ./agent
        run: cargo build --release
      - name: Run image builder
        working-directory: ./image
        run: |
          sudo bash build-image.sh
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: ph-agent-iso
          path: |
            ./image/ph-agent-live-*.iso
